name: daily-brief

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        required: true
        default: "send"
        type: choice
        options:
          - send
          - no-send
  schedule:
    # UTC 23:00 == 北京时间次日 07:00（GitHub 调度可能延迟）
    - cron: "0 23 * * *"

permissions:
  contents: write

concurrency:
  group: daily-technical-report
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Validate selection and delivery behavior
        run: python -m unittest -v test_reports.py
      - name: Run brief
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          MODE: ${{ github.event.inputs.mode || 'send' }}
        run: |
          if [ "$MODE" = "no-send" ]; then
            python main.py --no-send
          else
            python main.py
          fi
      - name: Persist successful delivery state
        if: ${{ success() && github.event.inputs.mode != 'no-send' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add delivery-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Record successful technical report delivery [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload report and delivery receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-brief-html
          path: |
            briefs/*.html
            briefs/*.txt
            delivery-state.json
          if-no-files-found: warn

